name: verify

# The full verification gate (CLAUDE.md §7a): build, lint, unit tests, brand,
# migrations from zero, report contract, SQL suites and the upgrade replay.
# scripts/verify-all.sh's exit code is the verdict.

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start PostgreSQL
        run: sudo systemctl start postgresql.service && sudo -u postgres pg_isready --timeout=30
      - name: Verification gate
        run: bash scripts/verify-all.sh
      # Production dependencies only; high and above fails. The two moderate
      # uuid advisories via exceljs are triaged in docs/release-baseline.md.
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
